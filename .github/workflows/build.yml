name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests
        run: mvn -B verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Version
        id: version
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $pomVersion = ([xml](Get-Content pom.xml -Raw -Encoding UTF8)).project.version
          if ($version -ne $pomVersion) { throw "Tag $env:GITHUB_REF_NAME does not match the pom.xml version ($pomVersion)" }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")

      # Windows PowerShell (as used by the Maven build): the DPAPI password file of the
      # ephemeral certificate must be written and read by the same user and PowerShell.
      - name: Signing certificate
        id: cert
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.SYNORIGHT_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SYNORIGHT_SIGN_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sign'
          $pfx = Join-Path $dir 'synoRight.pfx'
          if ($env:PFX_BASE64 -and $env:PFX_PASSWORD) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            # le mot de passe n'est transmis qu'à l'étape de build (env de l'étape)
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ephemeral=false`n")
          } else {
            Write-Host '::warning::No signing certificate secrets: the Windows 11 menu package is signed with an ephemeral certificate.'
            & .\native\create-cert.ps1 -OutDir $dir
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ephemeral=true`n")
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SYNORIGHT_SIGN_PFX=$pfx`n")

      # Windows PowerShell : Maven lance build.ps1 avec powershell.exe (5.1) ; lancé depuis pwsh, le PSModulePath
      # de PowerShell 7 empêche 5.1 de charger ConvertTo-SecureString (Microsoft.PowerShell.Security)
      - name: Build application
        shell: powershell
        env:
          # empty without secret: build.ps1 then reads the DPAPI password file next to the ephemeral pfx
          SYNORIGHT_SIGN_PASSWORD: ${{ secrets.SYNORIGHT_SIGN_PASSWORD }}
        run: mvn -B package -Pexe -DskipTests

      # PowerShell 7: Compress-Archive writes portable (forward slash) zip entries
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EPHEMERAL: ${{ steps.cert.outputs.ephemeral }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path target\dist\synoRight -DestinationPath "release\synoRight-$env:VERSION-windows-x64.zip"
          Copy-Item target\synoRight.jar "release\synoRight-$env:VERSION.jar"
          $notes = @(
            '## Installation'
            ''
            "1. Download ``synoRight-$env:VERSION-windows-x64.zip`` and unzip it into e.g. ``C:\Program Files`` (the archive contains a ``synoRight`` folder; writing there needs administrator rights) or into any folder."
            '2. Run `synoRightGui.exe` to configure the NAS connection, the photo folder and the groups, then install the File Explorer menu.'
            '3. The Windows 11 menu asks once for administrator approval, to trust the `CN=synoRight` certificate shipped as `synoRight.cer`.'
            ''
            "``synoRight-$env:VERSION.jar`` is the command line alone (``java -jar``, Java 25+), without the Windows 11 menu."
          )
          if ($env:EPHEMERAL -eq 'true') {
            $notes += @(
              ''
              '> [!WARNING]'
              '> The Windows 11 menu package of this build is signed with an **ephemeral certificate** generated for this build only. Installing a later version will ask again for administrator approval of its certificate.'
            )
          }
          [IO.File]::WriteAllLines("$PWD\release\notes.md", $notes)

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: synoRight ${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body_path: release/notes.md
          files: |
            release/synoRight-${{ steps.version.outputs.version }}-windows-x64.zip
            release/synoRight-${{ steps.version.outputs.version }}.jar
