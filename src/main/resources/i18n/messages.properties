synoRight.usage.description=Synchronizes Synology Photos album permissions with @<group>.synoRight files placed in the photo folders.
cli.opt.config=Configuration directory (default: ~/.synoRight, or the current directory if it contains one).
cli.opt.verbose=Show processing times and error details (can also be enabled with verbose=true in the configuration).
cli.opt.pause=Wait for Enter before returning (window opened by the context menu).
cli.opt.forget=Forget the password: it will be asked at each login.
cli.opt.modern=Windows 11 main menu (administrator authorization the first time).
cli.opt.classic=Classic menu (Show more options).
cli.opt.all=Both menus.
cli.opt.yes=Apply without asking for confirmation.
cli.opt.dryRun=Show the changes without applying them.
cli.opt.guiPush=Highlight the files -> Photos synchronization.
cli.opt.guiPull=Highlight the Photos -> files synchronization.
cli.param.folder=Folders (default: current directory).
cli.param.group=Group name (as configured).
synoRight.init.usage.description=Configuration wizard: NAS connection, photo folder, groups and context menu.
synoRight.status.usage.description=Shows the differences between the permission files and Synology Photos, without changing anything.
synoRight.pull.usage.description=Synology Photos -> files: creates/deletes the .synoRight files according to the Synology Photos permissions.
synoRight.push.usage.description=Files -> Synology Photos: applies to Synology Photos the permissions described by the .synoRight files.
synoRight.show.usage.description=Shows a folder's permissions on the Synology Photos side and on the files side.
synoRight.grant.usage.description=Grants a group permission on a folder (and on its parent folder).
synoRight.revoke.usage.description=Removes a group's permission on a folder.
synoRight.rights.usage.description=Chooses the groups allowed on a folder.
synoRight.config.usage.description=Shows the configuration and checks access to the photo folder, the NAS and the groups.
synoRight.groups.usage.description=Lists the managed groups.
synoRight.groups.add.usage.description=Adds groups, chosen among those of the NAS.
synoRight.groups.remove.usage.description=Removes groups from the configuration (without touching existing permissions or files).
synoRight.password.usage.description=Changes the stored password (verified against the NAS), or forgets it with --forget.
synoRight.logout.usage.description=Forgets the stored Synology session (the next login will ask for the OTP again).
synoRight.menu.usage.description=Windows Explorer context menu.
synoRight.menu.install.usage.description=Installs (or updates) the context menu for the current user.
synoRight.menu.uninstall.usage.description=Uninstalls the context menu.
synoRight.menu.repair.usage.description=Repair the File Explorer menus after an update or a move of the application.
synoRight.gui.usage.description=Graphical interface (configuration window by default).
synoRight.gui.config.usage.description=Configuration window.
synoRight.gui.rights.usage.description=Permissions of a folder.
synoRight.gui.sync.usage.description=Synchronization with a preview of the differences.
synoRight.gui.grant.usage.description=Grants a group permission (result in a dialog).
synoRight.gui.revoke.usage.description=Removes a group's permission (result in a dialog).
synoRight.gui.open.usage.description=Opens the folder in Synology Photos.
