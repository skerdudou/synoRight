name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests
        run: mvn -B verify

  release:
    # pull request : installateur et archives construits avant la fusion (artefacts seuls, publication réservée aux tags)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # tag : la version doit correspondre au pom ; lancement manuel ou pull request : version du pom, sans publication
      - name: Version
        id: version
        shell: powershell
        run: |
          $pomVersion = ([xml](Get-Content pom.xml -Raw -Encoding UTF8)).project.version
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -ne $pomVersion) { throw "Tag $env:GITHUB_REF_NAME does not match the pom.xml version ($pomVersion)" }
          } else {
            $version = $pomVersion
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")

      # Windows PowerShell (as used by the Maven build): the DPAPI password file of the
      # ephemeral certificate must be written and read by the same user and PowerShell.
      - name: Signing certificate
        id: cert
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.SYNORIGHT_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SYNORIGHT_SIGN_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sign'
          $pfx = Join-Path $dir 'synoRight.pfx'
          if ($env:PFX_BASE64 -and $env:PFX_PASSWORD) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            # le mot de passe n'est transmis qu'à l'étape de build (env de l'étape)
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ephemeral=false`n")
          } else {
            Write-Host '::warning::No signing certificate secrets: the Windows 11 menu package is signed with an ephemeral certificate.'
            & .\native\create-cert.ps1 -OutDir $dir
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "ephemeral=true`n")
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SYNORIGHT_SIGN_PFX=$pfx`n")

      # Windows PowerShell : Maven lance build.ps1 avec powershell.exe (5.1) ; lancé depuis pwsh, le PSModulePath
      # de PowerShell 7 empêche 5.1 de charger ConvertTo-SecureString (Microsoft.PowerShell.Security)
      - name: Build application
        shell: powershell
        env:
          # empty without secret: build.ps1 then reads the DPAPI password file next to the ephemeral pfx
          SYNORIGHT_SIGN_PASSWORD: ${{ secrets.SYNORIGHT_SIGN_PASSWORD }}
        run: mvn -B package -Pexe -DskipTests

      # Installateur Inno Setup, construit à partir de l'application jpackage
      - name: Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup --no-progress -y
          # dossier selon la version majeure d'Inno Setup installée (Inno Setup 6, 7…)
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found under ${env:ProgramFiles(x86)}\Inno Setup*" }
          & $iscc.FullName /DAppVersion=$env:VERSION /DSourceDir="$PWD\target\dist\synoRight" /O"$PWD\release" native\installer\synoRight.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # PowerShell 7: Compress-Archive writes portable (forward slash) zip entries
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EPHEMERAL: ${{ steps.cert.outputs.ephemeral }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path target\dist\synoRight -DestinationPath "release\synoRight-$env:VERSION-windows-x64.zip"
          Copy-Item target\synoRight.jar "release\synoRight-$env:VERSION.jar"
          $notes = @(
            '## Installation'
            ''
            "1. Download ``synoRight-$env:VERSION-setup.exe`` and run it: per-user install, no administrator rights; updates install over the previous version, Explorer menus are updated automatically."
            '2. Run synoRight to configure the NAS connection, the photo folder and the groups, then install the File Explorer menu.'
            '3. The Windows 11 menu asks once for administrator approval, to trust the `CN=synoRight` certificate shipped as `synoRight.cer`.'
            ''
            "``synoRight-$env:VERSION-windows-x64.zip`` is the portable version: unzip it into any folder and run ``synoRightGui.exe`` (the archive contains a ``synoRight`` folder); the portable copy updates itself from the configuration window."
            ''
            "``synoRight-$env:VERSION.jar`` is the command line alone (``java -jar``, Java 25+), without the Windows 11 menu."
          )
          if ($env:EPHEMERAL -eq 'true') {
            $notes += @(
              ''
              '> [!WARNING]'
              '> The Windows 11 menu package of this build is signed with an **ephemeral certificate** generated for this build only. Installing a later version will ask again for administrator approval of its certificate.'
            )
          }
          [IO.File]::WriteAllLines("$PWD\release\notes.md", $notes)

      - uses: actions/upload-artifact@v7
        with:
          name: synoRight-${{ steps.version.outputs.version }}
          path: release/*

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: synoRight ${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body_path: release/notes.md
          files: |
            release/synoRight-${{ steps.version.outputs.version }}-setup.exe
            release/synoRight-${{ steps.version.outputs.version }}-windows-x64.zip
            release/synoRight-${{ steps.version.outputs.version }}.jar
